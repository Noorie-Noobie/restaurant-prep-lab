[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "restaurant-prep-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "altair>=5,<7", "pandas>=2.2,<4", "requests>=2.32,<3", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools.packages.find]
where = ["src"]
